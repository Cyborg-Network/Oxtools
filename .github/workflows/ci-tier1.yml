# GitHub Actions - Lint, test, and deploy the Next.js app (Tier 1)
#
# Vercel handles the actual deployment automatically on push.
# This workflow runs lint/type checks as a CI gate.

name: CI - Tier 1 (Next.js)

on:
  push:
    branches: [main, dev]
    paths:
      - "app/**"
  pull_request:
    branches: [main]
    paths:
      - "app/**"

defaults:
  run:
    working-directory: app

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx biome check ./src

  build:
    name: Build
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - name: Build Next.js
        run: npm run build
        env:
          OXLO_API_KEY: ${{ secrets.OXLO_API_KEY }}

      # Vercel picks up the build automatically on push to main.
      # No explicit deploy step needed here.
