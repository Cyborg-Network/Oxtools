# OxBot - AI-Powered PR Review Agent
#
# Automatically reviews every pull request.
# Posts inline code review comments on specific lines.
#
# SECURITY: Uses pull_request_target to always run the workflow
# from the BASE branch (main/dev), not the PR branch. This prevents
# malicious PRs from modifying the review script to exfiltrate secrets.
#
# Required secrets:
#   AZURE_AI_ENDPOINT - Azure Foundry OpenAI-compatible endpoint
#   AZURE_AI_KEY      - Azure Foundry API key

name: OxBot PR Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-review:
    name: AI Code Review
    runs-on: ubuntu-latest
    # Skip draft PRs
    if: github.event.pull_request.draft == false

    steps:
      # IMPORTANT: checkout the BASE branch, not the PR branch.
      # This ensures we always run our trusted review script,
      # even if the PR tries to modify it.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run OxBot Review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AZURE_AI_ENDPOINT: ${{ secrets.AZURE_AI_ENDPOINT }}
          AZURE_AI_KEY: ${{ secrets.AZURE_AI_KEY }}
        run: python .github/scripts/ai_pr_review.py
